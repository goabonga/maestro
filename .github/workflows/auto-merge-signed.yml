name: auto-merge-signed

# A write-access maintainer authorizes merging with the auto-merge label.
# Only trusted Python and Git plumbing run with the signing key. PR code
# runs in the ordinary CI, required before and after re-authoring/signing.
on:
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

concurrency:
  group: auto-merge-signed-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  MERGE_LABEL: auto-merge

jobs:
  merge:
    name: rebase, sign and fast-forward into main
    if: github.event.label.name == 'auto-merge' && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      LABELLER: ${{ github.event.sender.login }}
    steps:
      - name: Checkout trusted code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Validate merge authorization and signing availability
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: python3 trusted/scripts/ci_automation.py validate-merge --mode merge
      - name: Wait for original commit checks
        env:
          CHECKS_TOKEN: ${{ github.token }}
        run: python3 trusted/scripts/ci_automation.py wait --mode merge
      - name: Checkout validated PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Configure the maintainer signing identity
        working-directory: pr
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          PUSH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
          GIT_SIGNING_KEY: ${{ vars.GIT_SIGNING_KEY }}
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" configure-signing
      - name: Rebase and sign every commit
        working-directory: pr
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" rebase --mode merge
      - name: Push signed commits with an explicit lease
        working-directory: pr
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" push --mode merge
      - name: Wait for signed commit checks
        working-directory: pr
        env:
          CHECKS_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" wait --mode merge --signed
      - name: Fast-forward main after checks
        working-directory: pr
        run: python3 "$GITHUB_WORKSPACE/trusted/scripts/ci_automation.py" merge --mode merge
      - name: Remove signing credentials
        if: always()
        run: |
          if [ -f trusted/scripts/ci_automation.py ]; then
            python3 trusted/scripts/ci_automation.py cleanup
          fi
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          GIT_USER_NAME: ${{ vars.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ vars.GIT_USER_EMAIL }}
        run: python3 trusted/scripts/ci_automation.py summary --title "Signed automatic merge"
