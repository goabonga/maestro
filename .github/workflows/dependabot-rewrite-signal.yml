name: dependabot-rewrite-signal

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signal:
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted summary script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Signal a Dependabot update
        run: echo "Dependabot update ready for validation and signed rewriting."
      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 trusted/scripts/ci_automation.py summary --title "Dependabot rewrite signal"
          --body "Signals the trusted rewrite workflow; this job has read-only permissions."
